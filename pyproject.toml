[project]
name = "news-briefing"
version = "0.1.0"
description = "AI 기반 뉴스 브리핑 서비스 (Django & Gemini API)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "google-genai>=2.23.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "whitenoise>=6.12.0",
]

[project.scripts]
news-briefing = "news_briefing:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["news_briefing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
