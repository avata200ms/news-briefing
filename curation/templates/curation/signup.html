<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - AI 뉴스 큐레이터</title>
    <meta name="description" content="AI 뉴스 큐레이터 신규 계정 생성">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'curation/style.css' %}">
</head>
<body class="auth-body">
    <!-- 배경 글로우 오브젝트 -->
    <div class="glow-sphere glow-1"></div>
    <div class="glow-sphere glow-3"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- 브랜드 헤더 -->
            <div class="auth-brand">
                <div class="brand-icon">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                </div>
                <h1 class="auth-title">새 계정 만들기</h1>
                <p class="auth-subtitle">간단한 회원가입으로 AI 뉴스 브리핑을 경험해 보세요</p>
            </div>

            <!-- 에러 알림 메시지 -->
            {% if error_message %}
            <div class="auth-alert error">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error_message }}</span>
            </div>
            {% endif %}

            <!-- 회원가입 폼 -->
            <form method="POST" action="{% url 'curation:signup' %}" class="auth-form" id="signup-form">
                {% csrf_token %}

                <div class="input-group">
                    <label for="username" class="input-label">아이디 (3자 이상)</label>
                    <div class="input-field-wrapper">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="text-input" 
                            placeholder="사용할 아이디를 입력하세요" 
                            required 
                            minlength="3"
                            autofocus
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="password" class="input-label">비밀번호 (4자 이상)</label>
                    <div class="input-field-wrapper">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="text-input" 
                            placeholder="비밀번호를 입력하세요" 
                            required
                            minlength="4"
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="password_confirm" class="input-label">비밀번호 확인</label>
                    <div class="input-field-wrapper">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        <input 
                            type="password" 
                            id="password_confirm" 
                            name="password_confirm" 
                            class="text-input" 
                            placeholder="비밀번호를 한 번 더 입력하세요" 
                            required
                            minlength="4"
                        >
                    </div>
                </div>

                <button type="submit" class="btn-primary btn-auth-submit" id="btn-signup-submit">
                    <span>가입하고 시작하기</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </form>

            <!-- 하단 전환 링크 -->
            <div class="auth-footer">
                <span>이미 계정이 있으신가요?</span>
                <a href="{% url 'curation:login' %}" class="auth-link" id="link-to-login">로그인하기</a>
            </div>
        </div>
    </div>
</body>
</html>
